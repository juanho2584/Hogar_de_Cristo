name: Supabase Migrations CI

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migrations Files
        run: |
          echo "Verificando archivos de migración..."
          ls -la supabase/migrations/*.sql

      - name: Deploy to Supabase
        if: github.ref == 'refs/heads/main' && env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "xxpvajqqxaezfwvrnjhd"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
